[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwater-storage-gravimetry"
version = "0.1.0"
description = "Helper for separating groundwater and surface water storage from GRACE terrestrial water storage, used by the Lake Chad study."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "David Oloyede" }
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "xarray>=2023.0.0",
    "netcdf4>=1.6.0",
    "geopandas>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
