[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwater-storage-gravimetry"
version = "0.1.0"
description = "Satellite gravimetry mascon processing and terrestrial water storage mass balance for regional aquifer depletion analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "David Oloyede" }
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "xarray>=2023.0.0",
    "netcdf4>=1.6.0",
    "geopandas>=0.12.0",
    "spatial-stats-core @ git+https://github.com/oloyededavid/spatial-stats-core.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
